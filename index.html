<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautical Navigation Tools</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>
<body>

<div id="map"></div>

<div class="toolbar">
    <button id="distanceTool">Stechzirkel</button>
    <button id="bearingTool">Peilung</button>
    <button id="losTool">LOS-Linie</button>
    <button id="clearTool">Löschen</button>
</div>

<div class="info" id="info">
    Werkzeug auswählen<br>
    Punkte zum Verschieben ziehen
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="./app.js"></script>

</body>
</html>
