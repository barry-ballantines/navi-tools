<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautical Navigation Tools</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>
<body>

<div id="map"></div>

<div class="compass-rose" aria-label="Kompassrose mit magnetischer Missweisung nach WMM2025">
    <img
        id="geoCompassRose"
        src="https://map.openseamap.org/resources/map/nautical_compass_rose_geo_north.svg"
        alt=""
        draggable="false"
    >
    <img
        id="magCompassRose"
        src="https://map.openseamap.org/resources/map/nautical_compass_rose_mag_north.svg"
        alt=""
        draggable="false"
    >
    <div class="compass-variation">
        <p id="magCompassTextTop">Missweisung wird geladen</p>
        <p id="magCompassTextBottom">WMM2025 / NOAA</p>
    </div>
</div>

<div class="toolbar">
    <button id="losTool">LOS-Linie</button>
    <button id="clearTool">Löschen</button>
</div>

<div class="info" id="info">
    Werkzeug auswählen<br>
    Punkte zum Verschieben ziehen<br>
    Objekt anklicken und Entf drücken zum Löschen
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://map.openseamap.org/javascript/geomagjs/cof2Obj.js"></script>
<script src="https://map.openseamap.org/javascript/geomagjs/geomag.js"></script>

<script src="./app.js"></script>

</body>
</html>
