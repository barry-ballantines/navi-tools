<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautical Navigation Tools</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>
<body>

<div id="map"></div>

<div
    class="compass-rose"
    aria-label="Movable compass rose with WMM2025 magnetic variation"
    title="Drag to show magnetic variation at the center"
>
    <img
        id="geoCompassRose"
        src="https://map.openseamap.org/resources/map/nautical_compass_rose_geo_north.svg"
        alt=""
        draggable="false"
    >
    <img
        id="magCompassRose"
        src="https://map.openseamap.org/resources/map/nautical_compass_rose_mag_north.svg"
        alt=""
        draggable="false"
    >
    <div class="compass-variation">
        <p id="magCompassTextTop">Loading magnetic variation</p>
        <p id="magCompassTextBottom">WMM2025 / NOAA</p>
    </div>
    <button
        class="compass-resize"
        type="button"
        aria-label="Resize compass rose"
        title="Drag to resize the compass rose"
    ></button>
</div>

<div class="toolbar">
    <button id="fixTool">FIX</button>
    <button id="drTool" disabled>DR</button>
    <button id="clearTool">Clear</button>
</div>

<div class="info" id="info">
    <div id="infoMessage">
        Select FIX to place a fix<br>
        Select a point, then DR to create a dead-reckoning leg<br>
        Click an object and press Delete to remove it
    </div>
    <form id="pointInfo" hidden>
        <strong id="pointType"></strong>
        <label>Label <input id="pointLabel" type="text" required></label>
        <label>Latitude <input id="pointLat" type="number" step="any" required></label>
        <label>Longitude <input id="pointLng" type="number" step="any" required></label>
        <button type="submit">Apply</button>
    </form>
    <form id="lineInfo" hidden>
        <strong id="lineTitle">DR leg</strong>
        <label>True bearing (°)
            <input id="lineBearing" type="number" min="0" max="360" step="any" required>
        </label>
        <label>Distance (nm)
            <input id="lineDistance" type="number" min="0" step="any" required>
        </label>
        <button type="submit">Apply</button>
    </form>
</div>

<div id="drPopup" class="tool-popup" hidden>
    <form id="drForm">
        <strong>Create DR leg from <span id="drStartLabel"></span></strong>
        <label>True bearing (0°–360°)
            <input id="drBearing" type="number" min="0" max="360" step="any" required>
        </label>
        <label>Distance (nm)
            <input id="drDistance" type="number" min="0" step="any" required>
        </label>
        <div id="drError" role="alert"></div>
        <div class="popup-actions">
            <button type="submit">OK</button>
            <button id="drCancel" type="button">Cancel</button>
        </div>
    </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://map.openseamap.org/javascript/geomagjs/cof2Obj.js"></script>
<script src="https://map.openseamap.org/javascript/geomagjs/geomag.js"></script>

<script src="./app.js"></script>

</body>
</html>
